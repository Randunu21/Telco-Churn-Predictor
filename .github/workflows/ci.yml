# CI: lint, lockfile check, tests, then build -> smoke-test -> publish the images.
# Pushes to Dev/main publish the images that passed the smoke test; PRs into
# main run everything except the publish.

name: CI

on:
  push:
    branches: [Dev, main] # case-sensitive: "Dev", not "dev"
  pull_request:
    branches: [main] # PRs *into* main (tests the merge result)
  workflow_dispatch: # manual "Run workflow" button (appears once this file is on main)

# One run per branch/PR: a newer push cancels the older run still in progress.
# Runs on main are never cancelled, so every commit on main gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: read the repo, nothing else. Jobs that need more ask for it.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12" # keep in step with the Docker base images and scripts/lock.sh
  UV_SYSTEM_PYTHON: "1" # uv installs into the runner's Python (throwaway VM, no venv needed)
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  MLFLOW_DISABLE_TELEMETRY: "true"

jobs:
  lint:
    name: Lint, format and lockfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Tool versions come from the dev lock, so they are pinned in one place only.
      - name: Install uv and ruff (versions from requirements/dev.txt)
        run: |
          python -m pip install "$(grep -E '^uv==' requirements/dev.txt)"
          uv pip install "$(grep -E '^ruff==' requirements/dev.txt)"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Lockfiles match the .in files
        run: |
          scripts/lock.sh
          if ! git diff --exit-code -- requirements/; then
            echo "::error::Lockfiles are out of date. Run scripts/lock.sh and commit the result."
            exit 1
          fi

  test:
    name: Tests (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv (version from requirements/dev.txt)
        run: python -m pip install "$(grep -E '^uv==' requirements/dev.txt)"

      # Exactly the dev lock, then our package without dependencies (all pinned above).
      - name: Install dependencies and the package
        run: |
          uv pip install -r requirements/dev.txt
          uv pip install --no-deps -e .

      - name: Run tests with coverage
        run: >-
          python -m pytest
          --cov=telco_churn
          --cov-report=term-missing
          --cov-fail-under=85

  images:
    name: Build, smoke-test and publish images
    needs: [lint, test] # only build code that passed lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Job-level permissions REPLACE the workflow-level ones, so contents: read is
    # restated here; packages: write lets GITHUB_TOKEN push to ghcr.io.
    permissions:
      contents: read
      packages: write
    env:
      # Registry names must be lowercase, so these are written out, not derived
      # from the (mixed-case) GitHub username or repo name.
      API_IMAGE: ghcr.io/randunu21/telco-churn-api
      MLFLOW_IMAGE: ghcr.io/randunu21/telco-churn-mlflow
      # Seeding runs on the runner and talks to the Compose MLflow (published
      # on 127.0.0.1:5000); training reads the synthetic CSV instead of the
      # DVC dataset.
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
      DATA_RAW_PATH: ${{ github.workspace }}/.smoke/telco_smoke.csv
    steps:
      - uses: actions/checkout@v7

      # ---- 1. Build both images into the runner's Docker (not pushed yet) ----

      # BuildKit builder that can export layer caches to GitHub's cache service.
      - uses: docker/setup-buildx-action@v4

      # Tags (and OCI labels, including the one linking the package to this repo):
      #   sha-<short commit>  every build; never moves (deploy these)
      #   dev                 latest from Dev
      #   main, latest        latest from main
      - name: API image tags and labels
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/Dev' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: MLflow image tags and labels
        id: meta-mlflow
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.MLFLOW_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/Dev' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # load: true puts each image into the runner's Docker, so the smoke test
      # runs these exact images and the publish step pushes these exact images.
      # The extra local tag is the name compose.yaml uses. provenance: false
      # because the local Docker image store can't hold attestations.
      # mode=max caches every stage (incl. the API builder stage with the ~1 GB
      # dependency install); one cache scope per image; ignore-error so a
      # cache-service hiccup can't fail the build.
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          load: true
          provenance: false
          tags: |
            ${{ steps.meta-api.outputs.tags }}
            telco-churn-api:dev
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max,ignore-error=true

      - name: Build MLflow image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/mlflow.Dockerfile
          load: true
          provenance: false
          tags: |
            ${{ steps.meta-mlflow.outputs.tags }}
            telco-churn-mlflow:dev
          labels: ${{ steps.meta-mlflow.outputs.labels }}
          cache-from: type=gha,scope=mlflow
          cache-to: type=gha,scope=mlflow,mode=max,ignore-error=true

      # ---- 2. Smoke test: the real stack, from the images just built ----

      # compose.env is git-ignored; make a throwaway one from the template.
      - name: Create compose.env with a throwaway password
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          sed "s/<change-me>/${password}/g" compose.env.example > compose.env

      - name: Start Postgres and MLflow
        run: docker compose up --detach --no-build --wait --wait-timeout 180 postgres mlflow

      # The API refuses to start without telco-churn@champion, so train and
      # register one first (on the runner, with the dev lock).
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies for seeding
        run: |
          python -m pip install "$(grep -E '^uv==' requirements/dev.txt)"
          uv pip install -r requirements/dev.txt
          uv pip install --no-deps -e .

      - name: Seed a champion model (synthetic data)
        run: |
          python scripts/smoke/make_data.py "$DATA_RAW_PATH"
          python scripts/smoke/seed_champion.py

      - name: Start the API
        run: docker compose up --detach --no-build --wait --wait-timeout 180 api

      - name: Check the API contract
        run: scripts/smoke/check_api.sh http://localhost:8000

      - name: Container status and logs (on failure)
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

      # ---- 3. Publish: only pushes, only after the smoke test passed ----

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes every ghcr.io tag of the tested images (the local compose tags
      # have a different name, so they stay local).
      - name: Push images
        if: github.event_name == 'push'
        run: |
          docker push --all-tags "$API_IMAGE"
          docker push --all-tags "$MLFLOW_IMAGE"

      - name: Publish summary
        if: github.event_name == 'push'
        run: |
          {
            echo "### Published (smoke-tested)"
            echo '```'
            for image in "$API_IMAGE" "$MLFLOW_IMAGE"; do
              docker image inspect \
                --format '{{range .RepoTags}}{{println .}}{{end}}{{range .RepoDigests}}{{println .}}{{end}}' \
                "$(docker image ls --quiet "$image" | head -n 1)" | grep "^${image}"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
           