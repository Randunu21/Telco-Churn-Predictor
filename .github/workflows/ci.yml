# CI: lint, lockfile check, tests, image builds and ghcr.io publishing.
# Pushes to Dev/main publish images; PRs into main only build them.
# The Compose smoke test is added in a later step.

name: CI

on:
  push:
    branches: [Dev, main] # case-sensitive: "Dev", not "dev"
  pull_request:
    branches: [main] # PRs *into* main (tests the merge result)
  workflow_dispatch: # manual "Run workflow" button (appears once this file is on main)

# One run per branch/PR: a newer push cancels the older run still in progress.
# Runs on main are never cancelled, so every commit on main gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: read the repo, nothing else. Jobs that need more ask for it.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12" # keep in step with the Docker base images and scripts/lock.sh
  UV_SYSTEM_PYTHON: "1" # uv installs into the runner's Python (throwaway VM, no venv needed)
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  MLFLOW_DISABLE_TELEMETRY: "true"

jobs:
  lint:
    name: Lint, format and lockfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Tool versions come from the dev lock, so they are pinned in one place only.
      - name: Install uv and ruff (versions from requirements/dev.txt)
        run: |
          python -m pip install "$(grep -E '^uv==' requirements/dev.txt)"
          uv pip install "$(grep -E '^ruff==' requirements/dev.txt)"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Lockfiles match the .in files
        run: |
          scripts/lock.sh
          if ! git diff --exit-code -- requirements/; then
            echo "::error::Lockfiles are out of date. Run scripts/lock.sh and commit the result."
            exit 1
          fi

  test:
    name: Tests (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv (version from requirements/dev.txt)
        run: python -m pip install "$(grep -E '^uv==' requirements/dev.txt)"

      # Exactly the dev lock, then our package without dependencies (all pinned above).
      - name: Install dependencies and the package
        run: |
          uv pip install -r requirements/dev.txt
          uv pip install --no-deps -e .

      - name: Run tests with coverage
        run: >-
          python -m pytest
          --cov=telco_churn
          --cov-report=term-missing
          --cov-fail-under=85

  build:
    name: Build and publish image (${{ matrix.image }})
    needs: [lint, test] # only build code that passed lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Job-level permissions REPLACE the workflow-level ones, so contents: read is
    # restated here; packages: write lets GITHUB_TOKEN push to ghcr.io.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false # if one image fails, still finish the other (two results, not one)
      matrix:
        image: [api, mlflow] # -> docker/api.Dockerfile, docker/mlflow.Dockerfile
    env:
      # Registry names must be lowercase, so this is written out, not derived
      # from the (mixed-case) GitHub username or repo name.
      IMAGE: ghcr.io/randunu21/telco-churn-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7

      # BuildKit builder that can export layer caches to GitHub's cache service.
      - uses: docker/setup-buildx-action@v4

      # Tags (and OCI labels, including the one linking the package to this repo):
      #   sha-<short commit>  every build; never moves (deploy these)
      #   dev                 latest from Dev
      #   main, latest        latest from main
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/Dev' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Only pushes publish (the workflow's push trigger is limited to Dev and
      # main); pull requests and manual runs just build.
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push) ${{ matrix.image }} image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: . # repo root, like `docker build -f docker/... .`
          file: docker/${{ matrix.image }}.Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # mode=max caches every stage, including the API builder stage where
          # the ~1 GB dependency install happens. One cache scope per image, so
          # the two matrix jobs don't overwrite each other's cache.
          # ignore-error: a cache-service hiccup must not fail the build.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max,ignore-error=true

      # What was published, on the run's Summary page. Values go through env
      # vars rather than being pasted into the script (safer shell habit).
      - name: Publish summary
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published ${IMAGE}"
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo "Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"